<!DOCTYPE html>
<!--
    作者：魏士博
    建立时间：2026-11-02
    使用的大模型功能名称：Claude Code（DeepSeek-Chat）
    页面说明：第 17 课列表与列表详情（详情页）——根据 URL 中的 id 参数，使用 fetch 请求单个商品并展示
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 · 列表与列表详情</title>
    <style>
        /* ============ 基础样式 ============ */
        :root {
            --ink: #0b1220;
            --text: #334155;
            --muted: #71809a;
            --line: #e6eaf2;
            --brand: #4f46e5;
            --brand-2: #7c3aed;
            --green: #059669;
            --red: #ef4444;
            --amber: #f59e0b;
            --mono: "Cascadia Code", Consolas, "JetBrains Mono", "Courier New", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            background: #f5f6fa;
            background-image:
                radial-gradient(900px 420px at 10% -10%, rgba(79, 70, 229, 0.10), transparent 60%),
                radial-gradient(760px 380px at 96% 2%, rgba(124, 58, 237, 0.07), transparent 58%);
            background-repeat: no-repeat;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font-family: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        ::selection {
            background: rgba(79, 70, 229, 0.18);
        }

        .wrap {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px 64px;
        }

        /* ============ 顶部 ============ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 30px 0 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-mark {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: none;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.28);
            color: #fff;
            line-height: 1;
        }

        .brand-mark b {
            font-family: var(--mono);
            font-size: 17px;
            letter-spacing: -0.5px;
        }

        .brand-mark small {
            margin-top: 4px;
            font-family: var(--mono);
            font-size: 6.5px;
            letter-spacing: 0.8px;
            opacity: 0.75;
        }

        .crumbs {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            color: var(--muted);
            font-size: 11.5px;
        }

        .crumbs a {
            color: var(--brand);
            text-decoration: none;
        }

        .crumbs a:hover {
            text-decoration: underline;
        }

        .crumbs .sep {
            color: #cbd5e1;
        }

        .brand h1 {
            color: var(--ink);
            font-size: 21px;
            line-height: 1.3;
            letter-spacing: -0.4px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: none;
        }

        .lesson-chip {
            padding: 6px 11px;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--brand);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .back-link {
            padding: 7px 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fff;
            color: #475569;
            font-size: 12.5px;
            text-decoration: none;
            transition: 0.18s ease;
        }

        .back-link:hover {
            border-color: #b9c5e8;
            color: var(--brand);
        }

        /* ============ 状态行 ============ */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 16px 2px;
            color: var(--muted);
            font-size: 12.5px;
            transition: color 0.2s ease;
        }

        .status::before {
            content: "";
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .status[data-state="loading"] {
            color: #2563eb;
        }

        .status[data-state="loading"]::before {
            animation: pulse 1.1s ease-in-out infinite;
        }

        .status[data-state="ok"] {
            color: #059669;
        }

        .status[data-state="error"] {
            color: #dc2626;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ============ 详情主体 ============ */
        .detail-card {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 18px 46px rgba(15, 23, 42, 0.07);
        }

        .gallery {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            padding: 26px;
            background: linear-gradient(160deg, #f7f8fc, #eef1f8);
        }

        .main-pic {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: #fff;
        }

        .main-pic img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            padding: 20px;
            object-fit: contain;
        }

        .main-pic.is-loading::before {
            content: "图片加载中…";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .main-pic.img-failed::after,
        .thumb-btn.img-failed::after {
            content: "图片加载失败";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .thumbs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .thumb-btn {
            position: relative;
            width: 62px;
            height: 62px;
            padding: 5px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .thumb-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .thumb-btn:hover {
            border-color: #c7d0e6;
        }

        .thumb-btn.is-active {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .info {
            display: flex;
            flex-direction: column;
            padding: 32px 34px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            margin-bottom: 12px;
        }

        .cat {
            padding: 3px 9px;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--brand);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sku {
            color: #94a3b8;
            font-family: var(--mono);
            font-size: 10.5px;
        }

        .title {
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 27px;
            line-height: 1.32;
            letter-spacing: -0.6px;
        }

        .brand-line {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 12.5px;
        }

        .brand-line strong {
            color: #475569;
            font-weight: 600;
        }

        .rating-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 12px;
        }

        .stars {
            display: inline-flex;
            gap: 1px;
            font-size: 13px;
            line-height: 1;
        }

        .star {
            color: #d7dce6;
        }

        .star.on {
            color: #f59e0b;
        }

        .rating-row b {
            color: var(--ink);
            font-size: 13px;
        }

        .avail-badge {
            margin-left: 3px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #ecfdf5;
            color: var(--green);
            font-size: 10.5px;
            font-weight: 700;
        }

        .avail-badge.is-low {
            background: #fffbeb;
            color: #b45309;
        }

        .avail-badge.is-out {
            background: #fef2f2;
            color: #dc2626;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 9px;
            margin-bottom: 14px;
        }

        .price {
            color: var(--ink);
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .old-price {
            color: #a0aec2;
            font-size: 13px;
            text-decoration: line-through;
        }

        .save-tag {
            padding: 3px 8px;
            border-radius: 6px;
            background: #ecfdf5;
            color: var(--green);
            font-size: 11px;
            font-weight: 700;
        }

        .off-tag {
            padding: 3px 8px;
            border-radius: 6px;
            background: #fef2f2;
            color: #dc2626;
            font-size: 11px;
            font-weight: 700;
        }

        .desc {
            margin-bottom: 18px;
            color: #475569;
            font-size: 13.5px;
            line-height: 1.85;
        }

        .mini-facts {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 9px;
            margin-bottom: 20px;
            list-style: none;
        }

        .mini-facts li {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 9px 11px;
            border: 1px solid #eef2f9;
            border-radius: 10px;
            background: #f8faff;
        }

        .mini-facts span {
            color: var(--muted);
            font-size: 10.5px;
        }

        .mini-facts b {
            color: var(--ink);
            font-size: 12.5px;
            font-weight: 600;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 15px;
            border: 0;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .btn.primary {
            background: linear-gradient(135deg, #4f46e5, #6d28d9);
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.22);
            color: #fff;
        }

        .btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.3);
        }

        .btn.ghost {
            border: 1px solid var(--line);
            background: #fff;
            color: #475569;
        }

        .btn.ghost:hover {
            border-color: #b9c5e8;
            color: var(--brand);
        }

        .position {
            margin-left: auto;
            color: #94a3b8;
            font-size: 11.5px;
            white-space: nowrap;
        }

        /* ============ 面板 ============ */
        .panel-grid {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 18px;
            margin-top: 20px;
        }

        .panel {
            padding: 22px 24px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.04);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            color: var(--ink);
            font-size: 16px;
            line-height: 1.4;
        }

        .panel-title::before {
            content: "";
            flex: none;
            width: 4px;
            height: 15px;
            border-radius: 2px;
            background: linear-gradient(180deg, #4f46e5, #7c3aed);
        }

        .count {
            padding: 1px 7px;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--brand);
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 700;
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 24px;
            margin: 0;
        }

        .specs > div {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px dashed #edf1f8;
            font-size: 12.5px;
        }

        .specs dt {
            flex: none;
            color: var(--muted);
        }

        .specs dd {
            margin: 0;
            color: var(--ink);
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .tags-block {
            margin-top: 18px;
        }

        .tags-block h3 {
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 11.5px;
            font-weight: 700;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--brand);
            font-size: 11.5px;
            font-weight: 600;
        }

        .tags-empty {
            color: #94a3b8;
            font-size: 12px;
        }

        .reviews-panel {
            margin-top: 18px;
        }

        .reviews-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .reviews-head .panel-title {
            margin-bottom: 0;
        }

        .reviews-note {
            color: #94a3b8;
            font-size: 11.5px;
        }

        .reviews {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
        }

        .review-card {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 15px;
            border: 1px solid #eef1f7;
            border-radius: 12px;
            background: #fbfcfe;
        }

        .review-head {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .avatar {
            display: grid;
            place-items: center;
            flex: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .review-name {
            color: var(--ink);
            font-size: 12.5px;
            font-weight: 700;
            line-height: 1.35;
        }

        .review-date {
            color: #94a3b8;
            font-size: 10.5px;
        }

        .review-card .stars {
            font-size: 11.5px;
        }

        .review-comment {
            color: #475569;
            font-size: 12.5px;
            line-height: 1.75;
        }

        .reviews-empty {
            grid-column: 1 / -1;
            padding: 24px;
            border: 1px dashed #e1e7f1;
            border-radius: 12px;
            color: #94a3b8;
            font-size: 12.5px;
            text-align: center;
        }

        /* ============ 接口信息 ============ */
        .api-panel {
            margin-top: 20px;
            padding: 22px 24px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.04);
        }

        .api-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
        }

        .api-head h2 {
            color: var(--ink);
            font-size: 16px;
        }

        .api-head p {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .id-chip {
            flex: none;
            padding: 4px 10px;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--brand);
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
        }

        .api-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: 12px;
            background: #0f172a;
        }

        .method {
            flex: none;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(16, 185, 129, 0.16);
            color: #34d399;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .endpoint {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            color: #cbd5e1;
            font-family: var(--mono);
            font-size: 12.5px;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .endpoint::-webkit-scrollbar {
            display: none;
        }

        .copy-btn {
            flex: none;
            padding: 5px 11px;
            border: 1px solid #2c3b57;
            border-radius: 7px;
            background: transparent;
            color: #a9bad6;
            font-size: 11.5px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .copy-btn:hover {
            border-color: #4d6488;
            color: #fff;
        }

        .api-extra {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-top: 12px;
            color: #94a3b8;
            font-size: 11.5px;
        }

        .api-extra code {
            color: #64748b;
            font-family: var(--mono);
            font-size: 11px;
        }

        .raw {
            margin-top: 14px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .raw summary {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 14px;
            color: var(--ink);
            font-size: 12.5px;
            font-weight: 700;
            list-style: none;
            cursor: pointer;
            user-select: none;
        }

        .raw summary::-webkit-details-marker {
            display: none;
        }

        .raw summary::before {
            content: "▸";
            color: var(--brand);
            font-size: 10px;
            transition: transform 0.15s ease;
        }

        .raw[open] summary::before {
            transform: rotate(90deg);
        }

        .raw-size {
            margin-left: auto;
            color: #94a3b8;
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 400;
        }

        .raw pre {
            max-height: 340px;
            margin: 0;
            padding: 16px;
            overflow: auto;
            border-top: 1px solid #1e293b;
            background: #0f172a;
            color: #cbd5e1;
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ============ 骨架屏与错误 ============ */
        .hero-skeleton {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #fff;
        }

        .sk {
            border-radius: 8px;
            background: linear-gradient(90deg, #eef1f7 25%, #f8faff 37%, #eef1f7 63%);
            background-size: 400% 100%;
            animation: shimmer 1.3s ease infinite;
        }

        .sk-pic {
            aspect-ratio: 1 / 1;
            border-radius: 0;
            background: linear-gradient(90deg, #eceff6 25%, #f6f8fc 37%, #eceff6 63%);
            background-size: 400% 100%;
        }

        .sk-copy {
            display: grid;
            align-content: start;
            gap: 13px;
            padding: 34px;
        }

        .sk-line {
            height: 12px;
        }

        .sk-line.w25 { width: 25%; }
        .sk-line.w45 { width: 45%; }
        .sk-line.w70 { width: 70%; }
        .sk-line.w85 { width: 85%; }
        .sk-line.w90 { width: 90%; }

        .sk-title {
            width: 78%;
            height: 30px;
            margin: 2px 0 4px;
        }

        .sk-price {
            width: 40%;
            height: 32px;
            margin: 6px 0;
        }

        .sk-panels {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 18px;
            margin-top: 20px;
        }

        .sk-panel {
            height: 150px;
            border-radius: 18px;
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .error-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 58px 24px;
            border: 1px dashed #f0caca;
            border-radius: 18px;
            background: #fff;
            text-align: center;
        }

        .state-icon {
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            margin-bottom: 14px;
            border-radius: 50%;
            background: #fef2f2;
            color: #dc2626;
        }

        .state-icon svg {
            width: 25px;
            height: 25px;
        }

        .error-card h2 {
            margin-bottom: 6px;
            color: var(--ink);
            font-size: 17px;
        }

        .error-card p {
            max-width: 480px;
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.8;
        }

        .error-card .hint {
            margin-top: 5px;
            color: #94a3b8;
            font-family: var(--mono);
            font-size: 11px;
            word-break: break-all;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 18px;
        }

        /* ============ 页脚 ============ */
        .foot-note {
            max-width: 840px;
            margin-top: 16px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.85;
        }

        .foot-note code {
            font-family: var(--mono);
            font-size: 11.5px;
            color: #64748b;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 960px) {
            .detail-card,
            .hero-skeleton {
                grid-template-columns: 1fr;
            }

            .main-pic {
                aspect-ratio: 4 / 3;
            }

            .sk-pic {
                aspect-ratio: 4 / 3;
            }

            .panel-grid,
            .sk-panels {
                grid-template-columns: 1fr;
            }

            .reviews {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .wrap {
                padding: 0 14px 48px;
            }

            .topbar {
                flex-wrap: wrap;
                padding-top: 22px;
            }

            .top-actions {
                margin-left: auto;
            }

            .lesson-chip {
                display: none;
            }

            .gallery {
                padding: 18px;
            }

            .info {
                padding: 24px 22px;
            }

            .title {
                font-size: 23px;
            }

            .price {
                font-size: 28px;
            }

            .mini-facts {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .specs {
                grid-template-columns: 1fr;
            }

            .reviews {
                grid-template-columns: 1fr;
            }

            .panel,
            .api-panel {
                padding: 18px;
            }

            .api-bar {
                flex-wrap: wrap;
                gap: 8px 9px;
                padding: 12px;
            }

            .endpoint {
                order: 3;
                flex: 1 0 100%;
                overflow: visible;
                font-size: 11.5px;
                line-height: 1.5;
                white-space: normal;
                word-break: break-all;
            }

            .copy-btn {
                margin-left: auto;
            }

            .position {
                margin-left: 0;
            }

            .sk-copy {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"><b>17</b><small>DETAIL</small></span>
                <div>
                    <nav class="crumbs" aria-label="面包屑">
                        <a href="17-3.html">商品列表</a>
                        <span class="sep">/</span>
                        <span>商品详情</span>
                    </nav>
                    <h1>商品详情</h1>
                </div>
            </div>
            <div class="top-actions">
                <span class="lesson-chip">详情页 · <span id="topId">ID —</span></span>
                <a class="back-link" href="17-3.html">← 返回列表</a>
            </div>
        </header>

        <p class="status" id="status" data-state="loading" aria-live="polite">正在请求商品详情…</p>

        <main id="detail" aria-live="polite" aria-busy="true"></main>

        <section class="api-panel" aria-label="详情接口信息">
            <div class="api-head">
                <div>
                    <h2>本次接口请求</h2>
                    <p>详情页从 URL 读取 id，再请求单个商品</p>
                </div>
                <span class="id-chip" id="idBadge">商品 ID —</span>
            </div>

            <div class="api-bar">
                <span class="method">GET</span>
                <code class="endpoint" id="endpoint">https://dummyjson.com/products/{id}</code>
                <button class="copy-btn" id="copyEndpoint" type="button">复制</button>
            </div>

            <div class="api-extra" id="apiExtra">
                <span>返回字段：商品信息、图片、评价、库存与政策</span>
            </div>

            <details class="raw">
                <summary>查看详情接口原始 JSON<span class="raw-size" id="rawSize"></span></summary>
                <pre id="rawJson">请求成功后，这里会显示该商品的完整 JSON。</pre>
            </details>
        </section>

        <p class="foot-note">
            详情页地址形如 <code>17-3-detail.html?id=1</code>。
            页面读取 <code>id</code> 参数后请求 <code>https://dummyjson.com/products/{id}</code>，
            与列表页是两个相互独立的页面。
        </p>
    </div>

    <script>
        /* ==================== 配置与状态 ==================== */
        var API_BASE = "https://dummyjson.com/products/";
        var LIST_SIZE = 8;

        var params = new URLSearchParams(window.location.search);
        var rawId = params.get("id");
        var productId = rawId === null || rawId.trim() === "" ? 1 : Number(rawId);
        var idIsValid = Number.isInteger(productId) && productId > 0;

        var detailEl = document.getElementById("detail");
        var statusEl = document.getElementById("status");
        var endpointEl = document.getElementById("endpoint");
        var copyEndpoint = document.getElementById("copyEndpoint");
        var idBadge = document.getElementById("idBadge");
        var topId = document.getElementById("topId");
        var apiExtra = document.getElementById("apiExtra");
        var rawJson = document.getElementById("rawJson");
        var rawSize = document.getElementById("rawSize");
        var controller = null;

        /* ==================== 工具函数 ==================== */
        function esc(value) {
            return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function money(value) {
            var number = Number(value);
            return isFinite(number) ? "$" + number.toFixed(2) : "—";
        }

        function text(value, fallback) {
            return value === undefined || value === null || value === "" ? (fallback || "—") : value;
        }

        function timeText() {
            return new Date().toLocaleTimeString("zh-CN", { hour12: false });
        }

        function formatDate(value) {
            if (!value) return "—";
            var date = new Date(value);
            if (isNaN(date.getTime())) return String(value);
            return date.toLocaleDateString("zh-CN");
        }

        function formatDateTime(value) {
            if (!value) return "—";
            var date = new Date(value);
            if (isNaN(date.getTime())) return String(value);
            return date.toLocaleString("zh-CN", { hour12: false });
        }

        function setStatus(content, state) {
            statusEl.textContent = content;
            statusEl.setAttribute("data-state", state);
        }

        function availabilityInfo(status) {
            var map = {
                "In Stock": { label: "现货", cls: "" },
                "Low Stock": { label: "库存紧张", cls: "is-low" },
                "Out of Stock": { label: "缺货", cls: "is-out" }
            };
            return map[status] || { label: text(status, "未知"), cls: "" };
        }

        function starHTML(rating, className) {
            var value = Math.max(0, Math.min(5, Number(rating) || 0));
            var filled = Math.round(value);
            var stars = "";
            for (var i = 0; i < 5; i++) {
                stars += '<span class="star' + (i < filled ? " on" : "") + '">★</span>';
            }
            return '<span class="' + (className || "stars") + '" role="img" aria-label="' +
                value.toFixed(2) + ' 分，满分 5 分">' + stars + "</span>";
        }

        function copyText(value) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(value).then(function () {
                    return true;
                }).catch(function () {
                    return fallbackCopy(value);
                });
            }
            return Promise.resolve(fallbackCopy(value));
        }

        function fallbackCopy(value) {
            var area = document.createElement("textarea");
            area.value = value;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            var ok = false;
            try {
                ok = document.execCommand("copy");
            } catch (err) {
                ok = false;
            }
            document.body.removeChild(area);
            return ok;
        }

        /* ==================== 骨架屏 ==================== */
        function renderSkeleton() {
            detailEl.innerHTML =
                '<div class="hero-skeleton" aria-hidden="true">' +
                    '<div class="sk sk-pic"></div>' +
                    '<div class="sk-copy">' +
                        '<div class="sk sk-line w25"></div>' +
                        '<div class="sk sk-title"></div>' +
                        '<div class="sk sk-line w45"></div>' +
                        '<div class="sk sk-line w70"></div>' +
                        '<div class="sk sk-price"></div>' +
                        '<div class="sk sk-line w90"></div>' +
                        '<div class="sk sk-line w85"></div>' +
                    "</div>" +
                "</div>" +
                '<div class="sk-panels" aria-hidden="true">' +
                    '<div class="sk sk-panel"></div>' +
                    '<div class="sk sk-panel"></div>' +
                "</div>";
            detailEl.setAttribute("aria-busy", "true");
        }

        /* ==================== 详情渲染 ==================== */
        function row(label, value) {
            return "<div><dt>" + esc(label) + "</dt><dd>" + esc(value) + "</dd></div>";
        }

        function renderDetail(product) {
            var images = (Array.isArray(product.images) ? product.images : [])
                .filter(function (src) { return typeof src === "string" && src; });
            if (!images.length && product.thumbnail) images.push(product.thumbnail);

            var price = Number(product.price) || 0;
            var discount = Number(product.discountPercentage) || 0;
            var oldPrice = discount > 0 ? price / (1 - discount / 100) : null;
            var reviews = Array.isArray(product.reviews) ? product.reviews : [];
            var tags = Array.isArray(product.tags) ? product.tags : [];
            var dimensions = product.dimensions || {};
            var meta = product.meta || {};
            var availability = availabilityInfo(product.availabilityStatus);

            var dims = [
                dimensions.width, dimensions.height, dimensions.depth
            ].filter(function (value) {
                return value !== undefined && value !== null && value !== "";
            }).join(" × ");

            var thumbsHtml = images.length > 1
                ? '<div class="thumbs" id="thumbs" aria-label="商品图片缩略图"></div>'
                : "";

            var specsHtml =
                row("商品编号", "#" + product.id) +
                row("商品分类", text(product.category)) +
                row("品牌", text(product.brand)) +
                row("SKU", text(product.sku)) +
                row("条形码", text(meta.barcode)) +
                row("重量", product.weight == null ? "—" : product.weight + " g") +
                row("尺寸", dims || "—") +
                row("起订量", product.minimumOrderQuantity == null
                    ? "—"
                    : product.minimumOrderQuantity + " 件") +
                row("库存", product.stock == null ? "—" : product.stock + " 件") +
                row("库存状态", availability.label);

            var serviceHtml =
                row("保修信息", text(product.warrantyInformation)) +
                row("配送信息", text(product.shippingInformation)) +
                row("退货政策", text(product.returnPolicy)) +
                row("上架时间", formatDateTime(product.meta && product.meta.createdAt)) +
                row("数据更新", formatDateTime(product.meta && product.meta.updatedAt));

            var tagsHtml = tags.length
                ? tags.map(function (tag) {
                    return '<span class="tag">' + esc(tag) + "</span>";
                }).join("")
                : '<span class="tags-empty">暂无标签</span>';

            var reviewsHtml = reviews.length
                ? reviews.map(function (review) {
                    var initial = text(review.reviewerName, "?").charAt(0).toUpperCase();
                    return '<article class="review-card">' +
                        '<div class="review-head">' +
                            '<span class="avatar" aria-hidden="true">' + esc(initial) + "</span>" +
                            "<div>" +
                                '<div class="review-name">' + esc(text(review.reviewerName, "匿名用户")) + "</div>" +
                                '<div class="review-date">' + esc(formatDate(review.date)) + "</div>" +
                            "</div>" +
                        "</div>" +
                        starHTML(review.rating) +
                        '<p class="review-comment">“' + esc(text(review.comment, "暂无评价内容")) + "”</p>" +
                    "</article>";
                }).join("")
                : '<div class="reviews-empty">这件商品还没有用户评价。</div>';

            var navHtml = "";
            if (product.id >= 1 && product.id <= LIST_SIZE) {
                navHtml += '<span class="position">第 ' + product.id + " / " + LIST_SIZE + " 件</span>";
                if (product.id > 1) {
                    navHtml += '<a class="btn ghost" href="17-3-detail.html?id=' +
                        (product.id - 1) + '">← 上一件</a>';
                }
                if (product.id < LIST_SIZE) {
                    navHtml += '<a class="btn ghost" href="17-3-detail.html?id=' +
                        (product.id + 1) + '">下一件 →</a>';
                }
            }

            detailEl.innerHTML =
                '<article class="detail-card">' +
                    '<div class="gallery">' +
                        '<div class="main-pic is-loading" id="mainPic">' +
                            '<img id="mainImage" src="' + esc(images[0] || "") +
                                '" alt="' + esc(product.title || "商品图片") + '">' +
                        "</div>" +
                        thumbsHtml +
                    "</div>" +
                    '<div class="info">' +
                        '<div class="eyebrow">' +
                            '<span class="cat">' + esc(text(product.category, "商品")) + "</span>" +
                            '<span class="sku">SKU · ' + esc(text(product.sku)) + "</span>" +
                        "</div>" +
                        '<h2 class="title">' + esc(text(product.title, "未命名商品")) + "</h2>" +
                        '<p class="brand-line">品牌 · <strong>' + esc(text(product.brand, "暂无品牌")) + "</strong></p>" +
                        '<div class="rating-row">' +
                            starHTML(product.rating) +
                            "<b>" + Number(product.rating || 0).toFixed(2) + "</b>" +
                            "<span>· " + reviews.length + " 条评价</span>" +
                            '<span class="avail-badge ' + availability.cls + '">' +
                                esc(availability.label) + "</span>" +
                        "</div>" +
                        '<div class="price-row">' +
                            '<span class="price">' + money(price) + "</span>" +
                            (oldPrice ? '<span class="old-price">' + money(oldPrice) + "</span>" : "") +
                            (oldPrice ? '<span class="save-tag">立省 ' + money(oldPrice - price) + "</span>" : "") +
                            (discount > 0 ? '<span class="off-tag">-' + Math.round(discount) + "%</span>" : "") +
                        "</div>" +
                        '<p class="desc">' + esc(text(product.description, "暂无商品描述")) + "</p>" +
                        '<ul class="mini-facts">' +
                            "<li><span>库存</span><b>" +
                                (product.stock == null ? "—" : product.stock + " 件") + "</b></li>" +
                            "<li><span>起订量</span><b>" +
                                (product.minimumOrderQuantity == null
                                    ? "—"
                                    : product.minimumOrderQuantity + " 件") + "</b></li>" +
                            "<li><span>重量</span><b>" +
                                (product.weight == null ? "—" : product.weight + " g") + "</b></li>" +
                            "<li><span>状态</span><b>" + esc(availability.label) + "</b></li>" +
                        "</ul>" +
                        '<div class="hero-actions">' +
                            '<a class="btn primary" href="17-3.html">← 返回列表</a>' +
                            navHtml +
                        "</div>" +
                    "</div>" +
                "</article>" +

                '<div class="panel-grid">' +
                    '<section class="panel">' +
                        '<h2 class="panel-title">商品参数</h2>' +
                        '<dl class="specs">' + specsHtml + "</dl>" +
                    "</section>" +
                    '<section class="panel">' +
                        '<h2 class="panel-title">服务与政策</h2>' +
                        '<dl class="specs">' + serviceHtml + "</dl>" +
                        '<div class="tags-block">' +
                            '<h3>商品标签</h3>' +
                            '<div class="tags">' + tagsHtml + "</div>" +
                        "</div>" +
                    "</section>" +
                "</div>" +

                '<section class="panel reviews-panel">' +
                    '<div class="reviews-head">' +
                        '<h2 class="panel-title">用户评价 <span class="count">' +
                            reviews.length + "</span></h2>" +
                        '<span class="reviews-note">数据来自详情接口的 reviews 字段</span>' +
                    "</div>" +
                    '<div class="reviews">' + reviewsHtml + "</div>" +
                "</section>";

            detailEl.setAttribute("aria-busy", "false");

            bindGallery(images, product);
            bindImageFallback(document.getElementById("mainImage"),
                document.getElementById("mainPic"));

            document.title = (product.title || "商品详情") + " · 商品详情";
        }

        function bindGallery(images, product) {
            if (images.length <= 1) return;

            var thumbs = document.getElementById("thumbs");
            var mainImage = document.getElementById("mainImage");
            var mainPic = document.getElementById("mainPic");
            var buttons = [];

            images.forEach(function (src, index) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "thumb-btn" + (index === 0 ? " is-active" : "");
                btn.setAttribute("aria-label", "查看第 " + (index + 1) + " 张商品图片");
                btn.setAttribute("aria-pressed", index === 0 ? "true" : "false");

                var img = document.createElement("img");
                img.src = src;
                img.alt = (product.title || "商品") + " 图片 " + (index + 1);
                bindImageFallback(img, btn);
                btn.appendChild(img);

                btn.addEventListener("click", function () {
                    buttons.forEach(function (item) {
                        item.classList.remove("is-active");
                        item.setAttribute("aria-pressed", "false");
                    });
                    btn.classList.add("is-active");
                    btn.setAttribute("aria-pressed", "true");

                    mainImage.style.visibility = "";
                    mainPic.classList.remove("img-failed");
                    mainPic.classList.add("is-loading");
                    mainImage.src = src;
                    mainImage.alt = (product.title || "商品") + " 图片 " + (index + 1);
                });

                buttons.push(btn);
                thumbs.appendChild(btn);
            });
        }

        function bindImageFallback(img, wrapper) {
            if (!img || !wrapper) return;

            img.addEventListener("load", function () {
                wrapper.classList.remove("is-loading");
            });

            img.addEventListener("error", function () {
                img.style.visibility = "hidden";
                wrapper.classList.remove("is-loading");
                wrapper.classList.add("img-failed");
            });

            if (img.complete && img.naturalWidth > 0) {
                wrapper.classList.remove("is-loading");
            }
        }

        /* ==================== 接口信息 ==================== */
        function updateApiInfo(product) {
            var url = API_BASE + product.id;
            endpointEl.textContent = url;
            idBadge.textContent = "商品 ID " + product.id;
            topId.textContent = "ID " + product.id;

            var meta = product.meta || {};
            var updated = formatDateTime(meta.updatedAt);
            var barcode = meta.barcode || "—";

            apiExtra.innerHTML =
                "<span>请求地址：<code>" + esc(url) + "</code></span>" +
                "<span>条形码：<code>" + esc(barcode) + "</code></span>" +
                "<span>数据更新：<code>" + esc(updated) + "</code></span>";

            var pretty = JSON.stringify(product, null, 2);
            rawJson.textContent = pretty;
            rawSize.textContent = pretty.length + " 个字符";
        }

        /* ==================== 错误状态 ==================== */
        function showError(message, canRetry) {
            detailEl.innerHTML =
                '<div class="error-card">' +
                    '<span class="state-icon" aria-hidden="true">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
                        'stroke-linecap="round"><path d="M12 8v5"></path>' +
                        '<circle cx="12" cy="16.5" r=".6" fill="currentColor"></circle>' +
                        '<path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>' +
                    "</span>" +
                    "<h2>未能加载商品详情</h2>" +
                    "<p>" + esc(message) + "</p>" +
                    '<p class="hint">详情接口：' + esc(API_BASE + (idIsValid ? productId : "{id}")) + "</p>" +
                    '<div class="error-actions">' +
                        '<a class="btn primary" href="17-3.html">返回列表</a>' +
                        (canRetry ? '<button class="btn ghost" id="retryBtn" type="button">重试</button>' : "") +
                    "</div>" +
                "</div>";
            detailEl.setAttribute("aria-busy", "false");

            if (canRetry) {
                var retry = document.getElementById("retryBtn");
                if (retry) retry.addEventListener("click", loadDetail);
            }

            apiExtra.innerHTML = '<span>请求地址：<code>' +
                esc(API_BASE + (idIsValid ? productId : "{id}")) + "</code></span>";
            rawJson.textContent = "请求失败，没有可显示的 JSON。";
            rawSize.textContent = "";
        }

        /* ==================== 请求详情 ==================== */
        function loadDetail() {
            if (controller) controller.abort();
            controller = new AbortController();

            renderSkeleton();
            setStatus("正在请求商品详情…", "loading");

            fetch(API_BASE + productId, {
                method: "GET",
                headers: { "Accept": "application/json" },
                signal: controller.signal
            })
                .then(function (response) {
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error("没有找到 ID 为 " + productId + " 的商品");
                        }
                        throw new Error("接口返回 HTTP " + response.status + " " + response.statusText);
                    }
                    return response.json();
                })
                .then(function (product) {
                    if (!product || product.id == null) {
                        throw new Error("接口返回的商品数据格式不正确");
                    }

                    renderDetail(product);
                    updateApiInfo(product);
                    setStatus(
                        "详情请求成功 · HTTP 200 · 商品 ID " + product.id +
                        " · " + timeText(),
                        "ok"
                    );
                })
                .catch(function (error) {
                    if (error.name === "AbortError") return;

                    var message = error.message || "未知错误";
                    if (error instanceof TypeError) {
                        message = "无法连接到详情接口，请检查网络连接。";
                    }
                    showError(message, true);
                    setStatus("详情请求失败：" + message, "error");
                })
                .finally(function () {
                    controller = null;
                });
        }

        /* ==================== 初始化 ==================== */
        if (!idIsValid) {
            endpointEl.textContent = API_BASE + "{id}";
            idBadge.textContent = "商品 ID —";
            topId.textContent = "ID —";
            setStatus("商品 ID 无效", "error");
            showError(
                "商品 ID 无效：“" + rawId + "”。地址应形如 17-3-detail.html?id=1。",
                false
            );
        } else {
            endpointEl.textContent = API_BASE + productId;
            idBadge.textContent = "商品 ID " + productId;
            topId.textContent = "ID " + productId;
            loadDetail();
        }

        copyEndpoint.addEventListener("click", function () {
            copyText(API_BASE + (idIsValid ? productId : "{id}")).then(function (ok) {
                copyEndpoint.textContent = ok ? "已复制 ✓" : "复制失败";
                setTimeout(function () {
                    copyEndpoint.textContent = "复制";
                }, 1400);
            });
        });
    </script>
</body>
</html>
