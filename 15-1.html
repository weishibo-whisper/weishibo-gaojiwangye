<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数7游戏</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .tips {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        .box-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
            gap: 10px;
        }

        .box {
            width: 70px;
            height: 70px;
            background: #fff;
            border: 2px solid #4a90d9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            box-sizing: border-box;
        }

        /* 满足数7规则的盒子：显示为空盒子 */
        .box.empty {
            background: #d9e8f7;
            border-style: dashed;
            color: transparent;
        }
    </style>
</head>
<body>
    <h1>数7游戏（1~100）</h1>
    <p class="tips">是7的倍数或含数字7的盒子为空，其余盒子显示数字</p>

    <div class="box-container" id="boxContainer"></div>

    <script>
        // 判断是否满足数7规则：7的倍数 或 数字中含7（个位、十位等）
        function isSeven(n) {
            return n % 7 === 0 || String(n).indexOf('7') !== -1;
        }

        var container = document.getElementById('boxContainer');
        var html = '';
        for (var i = 1; i <= 100; i++) {
            if (isSeven(i)) {
                // 满足要求，显示空盒子
                html += '<div class="box empty"></div>';
            } else {
                // 不满足要求，显示数字
                html += '<div class="box">' + i + '</div>';
            }
        }
        container.innerHTML = html;
    </script>
</body>
</html>
